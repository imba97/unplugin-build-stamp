name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # 版本来自 package.json#packageManager，这里不要再指定 version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # OIDC Trusted Publisher：无需 NPM_TOKEN
      - run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
